split1_pilot:
    data_path: ./dataset/GenImage
    known_classes: ['real', 'wukong', 'Midjourney', 'VQDM', 'stable_diffusion_v_1_4']
    unknown_classes:
        all: ['stable_diffusion_v_1_5', 'BigGAN', 'ADM', 'glide']
    train_collection: split1_pilot_train
    val_collection: split1_pilot_val
    test_data_path: ./dataset/GenImage/split1_pilot_val/annotations/split1_pilot_val.txt
    out_data_paths:
        all: ./dataset/GenImage/split1_pilot_val/annotations/split1_pilot_val_out_all.txt
        test_all: ./dataset/GenImage/split1_pilot_val/annotations/split1_pilot_val_out_all.txt

